<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f7fa">
  <title>Endless Runner</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="game-card">
    <header class="game-header">
      <div>
        <p class="eyebrow">A mini dino game:</p>
        <h1>LOSER IF YOU STOP:</h1>
      </div>
      <div class="scores" aria-label="Scores">
        <p>Score <strong id="score">0</strong></p>
        <p>Best <strong id="best-score">0</strong></p>
      </div>
    </header>

    <canvas id="game" width="800" height="300" aria-label="Endless runner game"></canvas>
    <p id="game-message" class="game-message" aria-live="polite">Press Space or tap to start</p>

    <p class="controls">Jump with <kbd>Space</kbd> or <kbd>↑</kbd>. Tap the game to jump on touch screens.</p>
  </main>
</body>
</html>
